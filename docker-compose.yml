# RestoQR — Docker Compose (dev + Dokploy compatible)
# Production: set APP_ENV=production + strong secrets in .env

name: resto

services:

  # ── MySQL ────────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      ${DB_DATABASE:-restodb}
      MYSQL_USER:          ${DB_USERNAME:-restouser}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restoqr

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - restoqr

  # ── Laravel API (PHP-FPM) ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      APP_ENV:       ${APP_ENV:-local}
      DB_HOST:       db
      REDIS_HOST:    redis
      FRONTEND_URL:  ${FRONTEND_URL:-http://192.168.1.57}
    volumes:
      - backend_storage:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - restoqr

  # ── Frontend (React build + Nginx) ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_storage:/var/www/html/storage/app/public:ro
    depends_on:
      - backend
    networks:
      - restoqr

  # ── Queue Worker ──────────────────────────────────────────────────────────────
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    env_file: ./backend/.env
    environment:
      APP_ENV:    ${APP_ENV:-local}
      DB_HOST:    db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - restoqr

volumes:
  db_data:
  redis_data:
  backend_storage:

networks:
  restoqr:
    driver: bridge
