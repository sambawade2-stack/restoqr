# RestoQR — Docker Compose (Dokploy / production)
# Variables requises : voir .env.example
# Dev local : ajouter "ports: ['80:80']" au service frontend et supprimer les labels Traefik

name: resto

services:

  # ── MySQL ────────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      ${DB_DATABASE:-restodb}
      MYSQL_USER:          ${DB_USERNAME:-restouser}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restoqr

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - restoqr

  # ── Laravel API (PHP-FPM) ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME:    RestoQR
      APP_ENV:     ${APP_ENV:-production}
      APP_KEY:     ${APP_KEY}
      APP_DEBUG:   ${APP_DEBUG:-false}
      APP_URL:     https://${DOMAIN}
      LOG_CHANNEL: stack
      LOG_LEVEL:   ${LOG_LEVEL:-error}
      DB_CONNECTION: mysql
      DB_HOST:       db
      DB_PORT:       3306
      DB_DATABASE:   ${DB_DATABASE:-restodb}
      DB_USERNAME:   ${DB_USERNAME:-restouser}
      DB_PASSWORD:   ${DB_PASSWORD}
      CACHE_DRIVER:             redis
      SESSION_DRIVER:           redis
      QUEUE_CONNECTION:         redis
      REDIS_HOST:               redis
      REDIS_PASSWORD:           null
      REDIS_PORT:               6379
      FILESYSTEM_DISK:          public
      FRONTEND_URL:             https://${DOMAIN}
    volumes:
      - backend_storage:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - restoqr

  # ── Frontend (React build + Nginx) ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    volumes:
      - backend_storage:/var/www/html/storage/app/public:ro
    depends_on:
      - backend
    networks:
      - restoqr
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.restoqr.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.restoqr.entrypoints=websecure"
      - "traefik.http.routers.restoqr.tls.certresolver=letsencrypt"
      - "traefik.http.services.restoqr.loadbalancer.server.port=80"
      - "traefik.http.routers.restoqr-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.restoqr-http.entrypoints=web"
      - "traefik.http.routers.restoqr-http.middlewares=redirect-to-https@docker"

  # ── Queue Worker ──────────────────────────────────────────────────────────────
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    environment:
      APP_NAME:    RestoQR
      APP_ENV:     ${APP_ENV:-production}
      APP_KEY:     ${APP_KEY}
      APP_DEBUG:   false
      APP_URL:     https://${DOMAIN}
      DB_CONNECTION: mysql
      DB_HOST:       db
      DB_PORT:       3306
      DB_DATABASE:   ${DB_DATABASE:-restodb}
      DB_USERNAME:   ${DB_USERNAME:-restouser}
      DB_PASSWORD:   ${DB_PASSWORD}
      CACHE_DRIVER:     redis
      SESSION_DRIVER:   redis
      QUEUE_CONNECTION: redis
      REDIS_HOST:       redis
      REDIS_PASSWORD:   null
      REDIS_PORT:       6379
      FILESYSTEM_DISK:  public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - restoqr

volumes:
  db_data:
  redis_data:
  backend_storage:

networks:
  restoqr:
    driver: bridge
  dokploy-network:
    external: true
